# HTTP Server (REST API) Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
  namespace: muro
  labels:
    app.kubernetes.io/name: http-server
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: muro
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: http-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: http-server
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: http-server
          image: muro-http-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: muro-config
                  key: HTTP_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: muro-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: muro-secrets
                  key: JWT_SECRET
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: muro-config
                  key: FRONTEND_URL
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: muro-config
                  key: NODE_ENV
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
# HTTP Server Service
apiVersion: v1
kind: Service
metadata:
  name: http-server
  namespace: muro
  labels:
    app.kubernetes.io/name: http-server
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app.kubernetes.io/name: http-server
