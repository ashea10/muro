# Secrets for sensitive configuration
# IMPORTANT: Replace placeholder values before applying!
# In production, use External Secrets Operator or Sealed Secrets
apiVersion: v1
kind: Secret
metadata:
  name: muro-secrets
  namespace: muro
  labels:
    app.kubernetes.io/name: muro
type: Opaque
stringData:
  # Database connection string
  # Format: postgresql://USER:PASSWORD@HOST:PORT/DATABASE
  DATABASE_URL: "postgresql://muro:muro_secret@postgres:5432/muro"
  
  # JWT Secret for authentication
  # IMPORTANT: Generate a strong secret for production!
  # Example: openssl rand -base64 32
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  
  # PostgreSQL credentials (for postgres StatefulSet)
  POSTGRES_USER: "muro"
  POSTGRES_PASSWORD: "muro_secret"
  POSTGRES_DB: "muro"
