# WebSocket Server Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-server
  namespace: muro
  labels:
    app.kubernetes.io/name: ws-server
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: muro
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ws-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ws-server
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: ws-server
          image: muro-ws-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: websocket
          env:
            - name: WS_PORT
              valueFrom:
                configMapKeyRef:
                  name: muro-config
                  key: WS_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: muro-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: muro-secrets
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: muro-config
                  key: NODE_ENV
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          # WebSocket servers need special handling for health checks
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
# WebSocket Server Service
apiVersion: v1
kind: Service
metadata:
  name: ws-server
  namespace: muro
  labels:
    app.kubernetes.io/name: ws-server
    app.kubernetes.io/component: backend
  annotations:
    # Enable sticky sessions for WebSocket connections
    service.kubernetes.io/topology-aware-hints: "auto"
spec:
  type: ClusterIP
  # Session affinity for WebSocket connections
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - port: 8080
      targetPort: 8080
      name: websocket
  selector:
    app.kubernetes.io/name: ws-server
