services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: muro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muro_secret}
      POSTGRES_DB: ${POSTGRES_DB:-muro}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-muro}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # HTTP Server (REST API)
  http-server:
    build:
      context: .
      dockerfile: apps/http-server/Dockerfile
    container_name: muro-http
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-muro}:${POSTGRES_PASSWORD:-muro_secret}@postgres:5432/${POSTGRES_DB:-muro}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 3001
    ports:
      - "3001:3001"

  # WebSocket Server
  ws-server:
    build:
      context: .
      dockerfile: apps/ws-server/Dockerfile
    container_name: muro-ws
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-muro}:${POSTGRES_PASSWORD:-muro_secret}@postgres:5432/${POSTGRES_DB:-muro}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      WS_PORT: 8080
    ports:
      - "8080:8080"

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: apps/muro-frontend/Dockerfile
    container_name: muro-frontend
    restart: unless-stopped
    depends_on:
      - http-server
      - ws-server
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
      NEXT_PUBLIC_WS_URL: ${WS_URL:-ws://localhost:8080}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
